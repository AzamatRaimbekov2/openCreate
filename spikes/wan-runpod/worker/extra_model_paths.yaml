# Points ComfyUI at the RunPod NETWORK VOLUME (mounted at /runpod-volume) so the
# ~28GB of Wan 2.2 weights are loaded from the volume and are NOT baked into the
# image or re-downloaded on cold start. bootstrap_volume.sh lays out this tree
# once; the serverless endpoint mounts the same volume read-only.
#
# If your volume mounts elsewhere (RunPod uses /runpod-volume for serverless and
# /workspace for pods), override COMFY paths via env or edit base_path below.
wan_volume:
  base_path: /runpod-volume/ComfyUI/models
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  clip_vision: clip_vision
  vae: vae
