packages:
  - apps/*
  - packages/*
allowBuilds:
  agentdb: set this to true or false
  argon2: set this to true or false
  better-sqlite3: true
  esbuild: true
  # CinemaStudio server-side render: ffmpeg-static's postinstall downloads the
  # ffmpeg binary. Allowed so the render worker has a real ffmpeg on disk; the
  # render module resolves the binary path lazily and fails cleanly if absent.
  ffmpeg-static: true
  hnswlib-node: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
